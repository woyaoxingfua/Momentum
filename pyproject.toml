[project]
name = "momentum-task-agent"
version = "0.1.0"
description = "Personal task todo agent with OpenAI Agents SDK integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "tzdata>=2024",
]
mysql = [
    "pymysql>=1.1",
]
mcp = [
    "mcp>=1.28",
    "uvicorn>=0.31",
    "starlette>=0.37",
]
wizard = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
momentum-agent = "momentum_agent.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
momentum_agent = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
