<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#20c997" />
  <title>Momentum — 登录</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    .login-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
      animation: fadeIn 0.4s ease-out;
    }
    .login-card .eyebrow {
      text-align: center;
      margin-bottom: 8px;
    }
    .login-card h1 {
      text-align: center;
      margin-bottom: 32px;
      font-size: 28px;
    }
    .login-card label {
      display: block;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .login-card input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }
    .login-card input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .login-card button[type="submit"] {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .login-card button[type="submit"]:hover {
      background: var(--accent-hover);
    }
    .login-card button[type="submit"]:active {
      transform: scale(0.98);
    }
    .login-card .error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
      padding: 10px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: var(--radius-sm);
    }
    .login-card .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .login-card .switch a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }
    .login-card .switch a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
      .login-card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <p class="eyebrow">Momentum</p>
    <h1 id="formTitle">登录</h1>

    <form id="authForm">
      <label>用户名 <input id="userId" autocomplete="username" required /></label>
      <label id="displayNameLabel" hidden>显示名称 <input id="displayName" /></label>
      <label>密码 <input id="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit" id="submitBtn">登录</button>
    </form>

    <div class="error" id="error" style="display: none;"></div>
    <div class="switch">
      <span id="switchText">没有账号？</span>
      <a id="switchLink">注册</a>
    </div>
  </div>
</div>

<script>
if (localStorage.getItem("momentum_token")) {
  window.location.href = "/";
}

let mode = "login";

document.querySelector("#switchLink").addEventListener("click", () => {
  mode = mode === "login" ? "register" : "login";
  document.querySelector("#formTitle").textContent = mode === "login" ? "登录" : "注册";
  document.querySelector("#submitBtn").textContent = mode === "login" ? "登录" : "注册";
  document.querySelector("#displayNameLabel").hidden = mode === "login";
  document.querySelector("#switchText").textContent = mode === "login" ? "没有账号？" : "已有账号？";
  document.querySelector("#switchLink").textContent = mode === "login" ? "注册" : "登录";
  document.querySelector("#error").style.display = "none";
});

document.querySelector("#authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = document.querySelector("#error");
  el.style.display = "none";

  const userId = document.querySelector("#userId").value.trim();
  const password = document.querySelector("#password").value.trim();
  if (!userId || !password) { el.textContent = "请填写用户名和密码"; el.style.display = "block"; return; }

  const endpoint = mode === "login" ? "/api/login" : "/api/register";
  const body = { user_id: userId, password };
  if (mode === "register") {
    const dn = document.querySelector("#displayName").value.trim();
    body.display_name = dn || userId;
    if (password.length < 4) { el.textContent = "密码至少 4 位"; el.style.display = "block"; return; }
  }

  try {
    const resp = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) { el.textContent = data.error || "请求失败"; el.style.display = "block"; return; }

    if (mode === "login") {
      localStorage.setItem("momentum_token", data.token);
      localStorage.setItem("momentum_user", data.user_id);
      window.location.href = "/";
    } else {
      el.style.display = "none";
      mode = "login";
      document.querySelector("#formTitle").textContent = "登录";
      document.querySelector("#submitBtn").textContent = "登录";
      document.querySelector("#displayNameLabel").hidden = true;
      document.querySelector("#switchText").textContent = "已有账号？";
      document.querySelector("#switchLink").textContent = "登录";
    }
  } catch (err) {
    el.textContent = "网络错误：" + err.message;
    el.style.display = "block";
  }
});
</script>
</body>
</html>
