<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121110" />
  <title>Momentum — 登录</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <img src="/icon.svg" alt="Momentum" />
      <span>Momentum</span>
    </div>
    <h1 id="formTitle">登录</h1>
    <p class="subtitle">管理你的任务，保持势头</p>

    <form id="authForm" autocomplete="on">
      <div class="form-group">
        <label for="userId">用户名</label>
        <input id="userId" autocomplete="username" required />
      </div>
      <div class="form-group" id="displayNameLabel" hidden>
        <label for="displayName">显示名称</label>
        <input id="displayName" autocomplete="nickname" />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="error" id="error"></div>
      <button type="submit" class="submit-btn" id="submitBtn">登录</button>
    </form>

    <div class="switch-row">
      <span id="switchText">没有账号？</span>
      <a id="switchLink">注册</a>
    </div>
  </div>

  <script>
    function qs(sel) { return document.querySelector(sel); }

    if (localStorage.getItem("momentum_token")) {
      window.location.href = "/";
      throw new Error("redirect");
    }

    let mode = "login";

    function switchMode() {
      mode = mode === "login" ? "register" : "login";
      qs("#formTitle").textContent = mode === "login" ? "登录" : "注册";
      qs("#submitBtn").textContent = mode === "login" ? "登录" : "注册";
      qs("#displayNameLabel").hidden = mode === "login";
      qs("#switchText").textContent = mode === "login" ? "没有账号？" : "已有账号？";
      qs("#switchLink").textContent = mode === "login" ? "注册" : "登录";
      qs("#error").style.display = "none";
      qs("#userId").focus();
    }

    qs("#switchLink").addEventListener("click", switchMode);

    qs("#authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = qs("#error");
      errEl.style.display = "none";
      errEl.style.color = "";
      errEl.style.background = "";
      errEl.style.borderColor = "";

      const userId = qs("#userId").value.trim();
      const password = qs("#password").value.trim();

      if (!userId || !password) {
        errEl.textContent = "请填写用户名和密码";
        errEl.style.display = "block";
        return;
      }

      const endpoint = mode === "login" ? "/api/login" : "/api/register";
      const body = { user_id: userId, password };

      if (mode === "register") {
        const dn = qs("#displayName").value.trim();
        body.display_name = dn || userId;
        if (password.length < 8) {
          errEl.textContent = "密码至少 8 位";
          errEl.style.display = "block";
          return;
        }
      }

      try {
        const resp = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await resp.json();

        if (!resp.ok) {
          errEl.textContent = data.error || "请求失败";
          errEl.style.display = "block";
          return;
        }

        if (mode === "login") {
          localStorage.setItem("momentum_token", data.token);
          localStorage.setItem("momentum_user", data.user_id);
          window.location.href = "/";
        } else {
          switchMode();
          qs("#password").value = "";
          errEl.textContent = "注册成功，请登录";
          errEl.style.display = "block";
          errEl.style.color = "var(--success)";
          errEl.style.background = "var(--success-bg)";
          errEl.style.borderColor = "var(--success)";
        }
      } catch (err) {
        errEl.textContent = "网络错误：" + err.message;
        errEl.style.display = "block";
      }
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
