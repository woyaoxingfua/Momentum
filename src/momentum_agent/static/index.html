<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momentum Task Agent</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <button id="themeToggle" class="theme-toggle" title="切换主题">&#9790;</button>
    <button id="coachToggle" class="coach-toggle" title="Agent助手">&#128172;</button>
    
    <main class="shell">
      <section class="workbench">
        <header class="topbar">
          <div>
            <p class="eyebrow">Momentum</p>
            <h1>任务助手</h1>
          </div>
          <div class="topbar-right">
            <span class="muted" id="currentUser"></span>
            <div class="task-count" id="taskCount">0 个待办</div>
            <button id="logoutButton" class="btn-secondary">退出</button>
          </div>
        </header>

        <section class="composer">
          <textarea id="taskInput" rows="3" placeholder="输入任务内容，例如：明天下午3点整理产品文档"></textarea>
          <div class="composer-actions">
            <button id="addTaskButton" class="btn-primary">新增任务</button>
            <button id="planTaskButton" class="btn-secondary-action">拆成计划</button>
            <button id="adviseButton" class="btn-secondary-action">今日建议</button>
            <button id="reviewButton" class="btn-secondary-action">复盘</button>
          </div>
        </section>

        <div class="weather-card">
          <div class="weather-header">
            <span class="weather-title">天气</span>
            <button id="refreshWeather" class="btn-icon" title="刷新">&#8635;</button>
          </div>
          <div class="weather-content">
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-desc" id="weatherDesc">加载中...</div>
          </div>
          <div class="weather-location">
            <input type="text" id="weatherCity" placeholder="输入城市名称查询天气..." list="cityList" />
            <datalist id="cityList">
              <option value="北京" />
              <option value="上海" />
              <option value="广州" />
              <option value="深圳" />
              <option value="成都" />
              <option value="杭州" />
              <option value="武汉" />
              <option value="西安" />
              <option value="南京" />
              <option value="重庆" />
              <option value="东京" />
              <option value="纽约" />
              <option value="伦敦" />
              <option value="巴黎" />
              <option value="新加坡" />
            </datalist>
          </div>
        </div>

        <section class="insight-card">
          <div class="insight-label">下一步</div>
          <p class="insight-text" id="adviceText">正在读取任务状态...</p>
        </section>

        <section class="heartbeat-card" id="heartbeatSection" style="display: none;">
          <div class="heartbeat-header">
            <div class="heartbeat-icon">!</div>
            <span class="heartbeat-title">主动提醒</span>
          </div>
          <p class="heartbeat-text" id="heartbeatText"></p>
          <div class="heartbeat-actions">
            <button id="heartbeatDismiss" class="btn-text">稍后提醒</button>
          </div>
        </section>

        <section class="task-list">
          <div class="section-header">
            <div class="status-tabs">
              <button class="status-tab active" data-status="todo">待办</button>
              <button class="status-tab" data-status="doing">进行中</button>
              <button class="status-tab" data-status="done">已完成</button>
              <button class="status-tab" data-status="dropped">已放弃</button>
            </div>
            <div class="header-actions">
              <input id="searchInput" placeholder="搜索任务..." class="search-input" />
              <button id="refreshButton" class="btn-icon" title="刷新">&#8635;</button>
              <button id="exportButton" class="btn-icon" title="导出数据">&#8681;</button>
              <label class="btn-secondary" title="导入数据">
                导入
                <input id="importFile" type="file" accept=".json" hidden />
              </label>
            </div>
          </div>
          <div id="tasks" class="tasks"></div>
        </section>
      </section>

      <aside class="coach" id="coach">
        <div class="coach-header">
          <h2>Agent</h2>
          <span class="provider-status" id="providerStatus">读取中...</span>
        </div>
        <div id="chatLog" class="chat-log"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" placeholder="与助手对话..." />
          <button class="btn-primary" type="submit">&#10148;</button>
        </form>
        <details class="config-panel">
          <summary>偏好设置</summary>
          <div class="config-form">
            <label>每日可用时间（分钟）
              <input id="configCapacity" type="number" min="0" max="480" placeholder="45" />
            </label>
            <label>工作时间开始
              <input id="configWorkStart" type="time" value="09:00" />
            </label>
            <label>工作时间结束
              <input id="configWorkEnd" type="time" value="18:00" />
            </label>
            <div class="config-divider"></div>
            <label class="checkbox-row">
              <input id="configHeartbeatEnabled" type="checkbox" />
              启用主动提醒
            </label>
            <label>提醒开始时间
              <input id="configHeartbeatStart" type="time" value="09:00" />
            </label>
            <label>提醒结束时间
              <input id="configHeartbeatEnd" type="time" value="21:00" />
            </label>
            <label>提醒间隔（小时）
              <input id="configHeartbeatInterval" type="number" min="1" max="24" value="4" />
            </label>
            <button id="configSaveButton" class="btn-primary">保存</button>
          </div>
        </details>
      </aside>
    </main>

    <dialog id="editDialog">
      <form method="dialog" class="edit-form">
        <h3>编辑任务</h3>
        <input type="hidden" id="editTaskId" />
        <label>标题 <input id="editTitle" /></label>
        <label>截止时间 <input id="editDue" type="datetime-local" /></label>
        <label>优先级
          <select id="editPriority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <label>预估时间（分钟）<input id="editEstimate" type="number" min="1" max="480" /></label>
        <label>标签（逗号分隔） <input id="editTags" placeholder="例如：工作, 紧急, 个人" /></label>
        <label>备注 <input id="editNotes" /></label>
        <div class="edit-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" id="editCancelButton" class="btn-secondary">取消</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
