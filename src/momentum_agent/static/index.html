<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20c997" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Momentum</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <main class="shell">
      <section class="workbench" aria-label="任务工作台">
        <header class="topbar">
          <div>
            <p class="eyebrow">Momentum</p>
            <h1>任务助手</h1>
          </div>
          <div class="topbar-right">
            <span class="muted" id="currentUser"></span>
            <div class="status-pill" id="taskCount">0 个待办</div>
            <button id="logoutButton" title="登出">退出</button>
          </div>
        </header>

        <section class="composer" aria-label="创建任务">
          <div id="imagePreview" class="image-preview" style="display: none;"></div>
          <textarea id="taskInput" rows="3" placeholder="例如：明天下午整理产品经理面试材料&#10;也可以上传图片，让 AI 从中提取任务"></textarea>
          <div class="composer-actions">
            <label id="imageUploadLabel" class="image-upload-label" title="上传图片">
              <input id="imageUpload" type="file" accept="image/*" multiple hidden />
              <span>📷</span>
            </label>
            <button id="addTaskButton" class="primary">新增任务</button>
            <button id="planTaskButton">拆成计划</button>
            <button id="adviseButton">今日建议</button>
            <button id="reviewButton">复盘</button>
          </div>
        </section>

        <section class="insight" aria-live="polite">
          <span class="insight-label">下一步</span>
          <p id="adviceText">正在读取任务状态...</p>
        </section>

        <section class="heartbeat" id="heartbeatSection" aria-live="polite" style="display: none;">
          <div class="heartbeat-header">
            <span class="heartbeat-icon">💡</span>
            <span class="insight-label">主动提醒</span>
          </div>
          <p id="heartbeatText"></p>
          <div class="heartbeat-actions">
            <button id="heartbeatDismiss" class="text-button">稍后提醒</button>
          </div>
        </section>

        <section class="task-list" aria-label="任务列表">
          <div class="section-heading">
            <div class="status-tabs">
              <button class="status-tab active" data-status="todo">待办</button>
              <button class="status-tab" data-status="doing">进行中</button>
              <button class="status-tab" data-status="done">已完成</button>
              <button class="status-tab" data-status="dropped">已放弃</button>
            </div>
            <div class="heading-actions">
              <input id="searchInput" placeholder="搜索任务..." class="search-input" />
              <button id="refreshButton" title="刷新">刷新</button>
              <button id="exportButton" title="导出数据">导出</button>
              <label class="import-label" title="导入数据">
                导入
                <input id="importFile" type="file" accept=".json" hidden />
              </label>
            </div>
          </div>
          <div id="tasks" class="tasks"></div>
        </section>
      </section>

      <aside class="coach" aria-label="Agent 对话">
        <div class="coach-header">
          <div class="section-heading">
            <h2>Agent</h2>
            <span class="muted" id="providerStatus">读取服务商...</span>
          </div>
        </div>
        <div id="chatLog" class="chat-log"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" placeholder="让助手帮你拆分、安排或复盘" />
          <button class="primary" type="submit">发送</button>
        </form>
        <details class="config-panel">
          <summary>偏好设置</summary>
          <div class="config-form">
            <h4 style="margin: 0 0 12px; font-size: 14px;">AI 配置</h4>
            <label>API Key
              <input id="configApiKey" type="password" placeholder="sk-... 留空使用本地 fallback" />
            </label>
            <label>API 基础地址
              <input id="configApiBase" type="text" placeholder="https://api.openai.com/v1 或第三方兼容地址" />
            </label>
            <label>模型名称
              <input id="configModel" type="text" placeholder="如：gpt-4o、claude-3-opus、deepseek-chat 等" />
            </label>
            <label class="checkbox-label" style="margin-top: 8px;">
              <input id="configVisionEnabled" type="checkbox" />
              启用视觉功能（上传图片识别任务）
            </label>
            <div class="config-divider"></div>
            <h4 style="margin: 0 0 12px; font-size: 14px;">工作配置</h4>
            <label>每日可用时间（分钟）
              <input id="configCapacity" type="number" min="0" max="480" placeholder="45" />
            </label>
            <label>工作时间开始
              <input id="configWorkStart" type="time" value="09:00" />
            </label>
            <label>工作时间结束
              <input id="configWorkEnd" type="time" value="18:00" />
            </label>
            <div class="config-divider"></div>
            <label class="checkbox-label">
              <input id="configHeartbeatEnabled" type="checkbox" />
              启用主动提醒
            </label>
            <label>提醒开始时间
              <input id="configHeartbeatStart" type="time" value="09:00" />
            </label>
            <label>提醒结束时间
              <input id="configHeartbeatEnd" type="time" value="21:00" />
            </label>
            <label>提醒间隔（小时）
              <input id="configHeartbeatInterval" type="number" min="1" max="24" value="4" />
            </label>
            <button id="configSaveButton" class="primary">保存</button>
          </div>
        </details>
      </aside>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav">
      <div class="mobile-nav-items">
        <button class="mobile-nav-item active" data-panel="tasks">
          <span>📋</span>
          <span>任务</span>
        </button>
        <button class="mobile-nav-item" data-panel="chat">
          <span>🤖</span>
          <span>Agent</span>
        </button>
        <button class="mobile-nav-item" data-panel="insights">
          <span>📊</span>
          <span>洞察</span>
        </button>
        <button class="mobile-nav-item" data-panel="settings">
          <span>⚙️</span>
          <span>设置</span>
        </button>
      </div>
    </nav>

    <!-- Mobile Panels -->
    <div class="mobile-panel" id="mobileChatPanel">
      <div class="mobile-panel-header">
        <h2>Agent</h2>
        <button class="mobile-panel-close" onclick="closeMobilePanel()">✕</button>
      </div>
      <div class="mobile-panel-body">
        <div id="mobileChatLog" class="chat-log" style="min-height: 400px; max-height: none;"></div>
        <form id="mobileChatForm" class="chat-form" style="margin-top: 12px;">
          <input id="mobileChatInput" placeholder="让助手帮你拆分、安排或复盘" />
          <button class="primary" type="submit">发送</button>
        </form>
      </div>
    </div>

    <div class="mobile-panel" id="mobileInsightsPanel">
      <div class="mobile-panel-header">
        <h2>行为洞察</h2>
        <button class="mobile-panel-close" onclick="closeMobilePanel()">✕</button>
      </div>
      <div class="mobile-panel-body" id="mobileInsightsBody">
        <p style="color: var(--text-muted);">加载中...</p>
      </div>
    </div>

    <div class="mobile-panel" id="mobileSettingsPanel">
      <div class="mobile-panel-header">
        <h2>设置</h2>
        <button class="mobile-panel-close" onclick="closeMobilePanel()">✕</button>
      </div>
      <div class="mobile-panel-body">
        <div class="config-form" id="mobileConfigForm">
          <h4 style="margin: 0 0 12px; font-size: 14px;">AI 配置</h4>
          <label>API Key
            <input id="mobileConfigApiKey" type="password" placeholder="sk-..." />
          </label>
          <label>API 基础地址
            <input id="mobileConfigApiBase" type="text" placeholder="https://api.openai.com/v1" />
          </label>
          <label>模型名称
            <input id="mobileConfigModel" type="text" placeholder="如：gpt-4o、deepseek-chat" />
          </label>
          <label class="checkbox-label" style="margin-top: 8px;">
            <input id="mobileConfigVisionEnabled" type="checkbox" />
            启用视觉功能
          </label>
          <div class="config-divider"></div>
          <h4 style="margin: 0 0 12px; font-size: 14px;">工作配置</h4>
          <label>每日可用时间（分钟）
            <input id="mobileConfigCapacity" type="number" min="0" max="480" placeholder="45" />
          </label>
          <label>工作时间开始
            <input id="mobileConfigWorkStart" type="time" value="09:00" />
          </label>
          <label>工作时间结束
            <input id="mobileConfigWorkEnd" type="time" value="18:00" />
          </label>
          <div class="config-divider"></div>
          <label class="checkbox-label">
            <input id="mobileConfigHeartbeatEnabled" type="checkbox" />
            启用主动提醒
          </label>
          <button id="mobileConfigSaveButton" class="primary" style="margin-top: 12px;">保存设置</button>
        </div>
      </div>
    </div>

    <!-- Dialogs -->
    <dialog id="editDialog">
      <form method="dialog" class="edit-form">
        <h3>编辑任务</h3>
        <input type="hidden" id="editTaskId" />
        <label>标题 <input id="editTitle" /></label>
        <label>截止时间 <input id="editDue" type="datetime-local" /></label>
        <label>优先级
          <select id="editPriority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <label>预估时间（分钟）<input id="editEstimate" type="number" min="1" max="480" /></label>
        <label>标签（逗号分隔） <input id="editTags" placeholder="例如：工作, 紧急, 个人" /></label>
        <label>备注 <input id="editNotes" /></label>
        <div class="edit-actions">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="editCancelButton">取消</button>
        </div>
      </form>
    </dialog>

    <dialog id="addSubtaskDialog">
      <form method="dialog" class="edit-form">
        <h3>添加子任务</h3>
        <input type="hidden" id="addSubtaskParentId" />
        <label>子任务标题 <input id="addSubtaskTitle" placeholder="输入子任务标题" /></label>
        <label>截止时间 <input id="addSubtaskDue" type="datetime-local" /></label>
        <label>优先级
          <select id="addSubtaskPriority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <label>预估时间（分钟）<input id="addSubtaskEstimate" type="number" min="1" max="480" /></label>
        <div class="edit-actions">
          <button type="submit" class="primary">添加</button>
          <button type="button" id="addSubtaskCancelButton">取消</button>
        </div>
      </form>
    </dialog>

    <dialog id="postponeDialog">
      <form method="dialog" class="edit-form">
        <h3>推迟任务</h3>
        <input type="hidden" id="postponeTaskId" />
        <label>推迟天数 <input id="postponeDays" type="number" min="1" max="365" value="3" /></label>
        <div class="postpone-options">
          <button type="button" class="postpone-option" data-days="1">1 天</button>
          <button type="button" class="postpone-option" data-days="3">3 天</button>
          <button type="button" class="postpone-option" data-days="7">1 周</button>
          <button type="button" class="postpone-option" data-days="30">1 个月</button>
        </div>
        <div class="edit-actions">
          <button type="submit" class="primary">确定推迟</button>
          <button type="button" id="postponeCancelButton">取消</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/app.js"></script>
    <script>
      // Mobile navigation
      function closeMobilePanel() {
        document.querySelectorAll('.mobile-panel').forEach(p => p.classList.remove('open'));
        document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.remove('active'));
        document.querySelector('.mobile-nav-item[data-panel="tasks"]').classList.add('active');
      }

      document.querySelectorAll('.mobile-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const panel = btn.dataset.panel;
          document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          if (panel === 'tasks') {
            closeMobilePanel();
            return;
          }

          const panelId = {
            chat: 'mobileChatPanel',
            insights: 'mobileInsightsPanel',
            settings: 'mobileSettingsPanel'
          }[panel];

          document.querySelectorAll('.mobile-panel').forEach(p => p.classList.remove('open'));
          const el = document.getElementById(panelId);
          if (el) {
            el.classList.add('open');
            // Trigger load for insights
            if (panel === 'insights') loadMobileInsights();
          }
        });
      });

      async function loadMobileInsights() {
        const body = document.getElementById('mobileInsightsBody');
        try {
          const token = localStorage.getItem('momentum_token');
          const resp = await fetch('/api/advice', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await resp.json();
          body.innerHTML = `<div class="insight" style="margin-top:0;"><span class="insight-label">建议</span><p>${data.advice || '暂无建议'}</p></div>`;

          const resp2 = await fetch('/api/review', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data2 = await resp2.json();
          if (data2.review) {
            body.innerHTML += `<div class="insight" style="margin-top:12px;"><span class="insight-label">复盘</span><p style="white-space: pre-line;">${data2.review}</p></div>`;
          }
        } catch(e) {
          body.innerHTML = '<p style="color: var(--text-muted);">加载失败</p>';
        }
      }
    </script>
  </body>
</html>
