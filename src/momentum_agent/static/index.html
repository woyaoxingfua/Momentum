<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momentum Task Agent</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workbench" aria-label="任务工作台">
        <header class="topbar">
          <div>
            <p class="eyebrow">Momentum</p>
            <h1>任务助手</h1>
          </div>
          <div class="topbar-right">
            <span class="muted" id="currentUser"></span>
            <div class="status-pill" id="taskCount">0 个待办</div>
            <button id="logoutButton" title="登出">退出</button>
          </div>
        </header>

        <section class="composer" aria-label="创建任务">
          <textarea id="taskInput" rows="3" placeholder="例如：明天下午整理产品经理面试材料"></textarea>
          <div class="composer-actions">
            <button id="addTaskButton" class="primary">新增任务</button>
            <button id="planTaskButton">拆成计划</button>
            <button id="adviseButton">今日建议</button>
            <button id="reviewButton">复盘</button>
          </div>
        </section>

        <section class="insight" aria-live="polite">
          <span class="insight-label">下一步</span>
          <p id="adviceText">正在读取任务状态...</p>
        </section>

        <section class="task-list" aria-label="任务列表">
          <div class="section-heading">
            <div class="status-tabs">
              <button class="status-tab active" data-status="todo">待办</button>
              <button class="status-tab" data-status="doing">进行中</button>
              <button class="status-tab" data-status="done">已完成</button>
              <button class="status-tab" data-status="dropped">已放弃</button>
            </div>
            <div class="heading-actions">
              <input id="searchInput" placeholder="搜索任务..." class="search-input" />
              <button id="refreshButton" title="刷新">刷新</button>
              <button id="exportButton" title="导出数据">导出</button>
              <label class="import-label" title="导入数据">
                导入
                <input id="importFile" type="file" accept=".json" hidden />
              </label>
            </div>
          </div>
          <div id="tasks" class="tasks"></div>
        </section>
      </section>

      <aside class="coach" aria-label="Agent 对话">
        <div class="section-heading">
          <h2>Agent</h2>
          <span class="muted" id="providerStatus">读取服务商...</span>
        </div>
        <div id="chatLog" class="chat-log"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" placeholder="让助手帮你拆分、安排或复盘" />
          <button class="primary" type="submit">发送</button>
        </form>
        <details class="config-panel">
          <summary>偏好设置</summary>
          <div class="config-form">
            <label>每日可用时间（分钟）
              <input id="configCapacity" type="number" min="0" max="480" placeholder="45" />
            </label>
            <label>工作时间开始
              <input id="configWorkStart" type="time" value="09:00" />
            </label>
            <label>工作时间结束
              <input id="configWorkEnd" type="time" value="18:00" />
            </label>
            <button id="configSaveButton" class="primary">保存</button>
          </div>
        </details>
      </aside>
    </main>

    <dialog id="editDialog">
      <form method="dialog" class="edit-form">
        <h3>编辑任务</h3>
        <input type="hidden" id="editTaskId" />
        <label>标题 <input id="editTitle" /></label>
        <label>截止时间 <input id="editDue" type="datetime-local" /></label>
        <label>优先级
          <select id="editPriority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <label>预估时间（分钟）<input id="editEstimate" type="number" min="1" max="480" /></label>
        <label>备注 <input id="editNotes" /></label>
        <div class="edit-actions">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="editCancelButton">取消</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
