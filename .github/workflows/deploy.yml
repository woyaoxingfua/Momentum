name: Test and Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
          log-public-key: false

      - name: Add VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SERVICE_NAME: ${{ secrets.VM_SERVICE_NAME }}
          VM_PROJECT_DIR: ${{ secrets.VM_PROJECT_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "set -e
             cd '$VM_PROJECT_DIR'
             git pull origin master
             source .venv/bin/activate || python3 -m venv .venv && source .venv/bin/activate
             pip install -e '.[dev]'
             sudo systemctl restart '$VM_SERVICE_NAME'
             echo 'Deployment completed and service restarted.'"
