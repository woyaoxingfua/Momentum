name: Test and Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,wizard]"

      - name: Run frontend tests
        run: node --test tests/frontend/*.test.mjs

      - name: Run tests
        run: pytest -q

  browser:
    # 浏览器回归是「建议性」的：会跑、会报，但不阻断部署（continue-on-error）。
    # 想把它变成硬门槛时，删掉 continue-on-error 并把本 job 加进 deploy 的 needs。
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,wizard]" playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Resolve Chromium path
        run: |
          CHROME=$(python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          echo "MOMENTUM_E2E_CHROMIUM=$CHROME" >> "$GITHUB_ENV"

      - name: Browser regression — focus recovery
        run: python tests/frontend/focus_recovery_browser.py

      - name: Browser regression — local-only attachments and frequent history
        run: python tests/frontend/local_first_browser.py

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            /tmp/momentum-focus-recovery-e2e/**
            /tmp/momentum-local-first-e2e/**
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
          log-public-key: false

      - name: Add VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SERVICE_NAME: ${{ secrets.VM_SERVICE_NAME }}
          VM_PROJECT_DIR: ${{ secrets.VM_PROJECT_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "cd '$VM_PROJECT_DIR' && \
             echo 'Step 1: Pulling latest code...' && \
             git pull origin master && \
             echo 'Step 2: Activating virtual environment...' && \
             source .venv/bin/activate && \
             echo 'Step 3: Installing dependencies...' && \
             pip install -e '.[mysql,dev,mcp]' --quiet && \
             echo 'Step 4: Restarting systemd service...' && \
             sudo systemctl daemon-reload && \
             sudo systemctl restart '$VM_SERVICE_NAME' && \
             sleep 3 && \
             echo 'Step 5: Checking service status...' && \
             sleep 5 && \
             sudo systemctl is-active --quiet '$VM_SERVICE_NAME' && \
             echo 'Service is active.' || \
             { echo 'ERROR: deployment failed, or the service is not active after restart'; sudo systemctl status '$VM_SERVICE_NAME' --no-pager -l | tail -n 30; exit 1; }"
