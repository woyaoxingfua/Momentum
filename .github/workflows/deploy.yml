name: Test and Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
          log-public-key: false

      - name: Add VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SERVICE_NAME: ${{ secrets.VM_SERVICE_NAME }}
          VM_PROJECT_DIR: ${{ secrets.VM_PROJECT_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "cd '$VM_PROJECT_DIR' && \
             echo 'Step 1: Pulling latest code...' && \
             git pull origin master && \
             echo 'Step 2: Activating virtual environment...' && \
             source .venv/bin/activate && \
             echo 'Step 3: Installing dependencies...' && \
             pip install -e '.[dev]' --quiet && \
             echo 'Step 4: Restarting systemd service...' && \
             sudo systemctl daemon-reload && \
             sudo systemctl restart '$VM_SERVICE_NAME' && \
             sleep 3 && \
             echo 'Step 5: Checking service status...' && \
             sleep 5 && \
             sudo systemctl is-active --quiet '$VM_SERVICE_NAME' || echo 'Warning: service may still be starting...' && \
             echo 'Deployment completed.'"
